name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional semantic version override e.g. 1.1.0'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper and build Debug APK
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./gradlew ]; then
            GRADLE_VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' gradle/wrapper/gradle-wrapper.properties | head -n 1 | sed 's/gradle-//')
            GRADLE_VER=${GRADLE_VER:-8.11.1}
            gradle wrapper --gradle-version "$GRADLE_VER"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Extract Semantic Version
        run: |
          OVERRIDE="${{ github.event.inputs.version_override }}"
          if [ -n "$OVERRIDE" ]; then
            APP_VERSION="$OVERRIDE"
          else
            APP_VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          fi
          APP_VERSION=${APP_VERSION:-1.0.0}
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-tally-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
